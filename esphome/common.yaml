# Shared board/network configuration. No UART TX is configured here.
esphome:
  name: powertech-gate
  friendly_name: Powertech
  min_version: 2026.10.0
  on_boot:
    - priority: 750
      then:
        - lambda: |-
            id(rf_switch_enable).turn_off();
            // Synchronous one-time wait: YAML delay would yield and allow
            // lower-priority Wi-Fi setup to start before antenna selection.
            esphome::delay(100);
            id(rf_antenna_select).turn_on();
            ESP_LOGI("rf", "External U.FL antenna selected");

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

output:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
  - platform: gpio
    id: rf_antenna_select
    pin: GPIO14

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    uart: WARN
    api: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Powertech Setup"
    password: !secret fallback_ap_password

captive_portal:
